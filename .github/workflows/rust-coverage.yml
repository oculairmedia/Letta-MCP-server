name: Rust Coverage

on:
    push:
        branches: [master, main]
        paths:
            - 'letta-server/**'
            - 'letta-types/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
    pull_request:
        branches: [master, main]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    coverage:
        name: Code Coverage
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview

            - name: Install mold linker
              run: sudo apt-get update -qq && sudo apt-get install -y -qq mold

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            - name: Cache cargo
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-coverage-

            - name: Generate coverage
              run: |
                  cargo llvm-cov --package letta-server --package letta-types \
                      --lcov --output-path lcov.info

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: lcov.info
                  flags: rust-tests
                  name: rust-codecov
                  fail_ci_if_error: false

            - name: Upload coverage artifact
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: lcov.info
                  retention-days: 30

            - name: Generate coverage summary
              if: always()
              run: |
                  set +e
                  echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ ! -f lcov.info ]; then
                      echo "⚠️ No coverage data generated" >> $GITHUB_STEP_SUMMARY
                      exit 0
                  fi

                  TOTAL_LINES=$(grep -c "^DA:" lcov.info 2>/dev/null || true)
                  TOTAL_LINES=${TOTAL_LINES:-0}
                  COVERED_LINES=$(awk -F, '/^DA:/ && $2 > 0 { count++ } END { print count+0 }' lcov.info)

                  if [ "$TOTAL_LINES" -gt 0 ]; then
                      COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($COVERED_LINES / $TOTAL_LINES) * 100}")
                      echo "**Overall Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
                      echo "" >> $GITHUB_STEP_SUMMARY
                      echo "- Lines covered: $COVERED_LINES / $TOTAL_LINES" >> $GITHUB_STEP_SUMMARY
                  else
                      echo "⚠️ No instrumented lines found" >> $GITHUB_STEP_SUMMARY
                  fi
