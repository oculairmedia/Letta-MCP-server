name: Rust Tests

on:
    push:
        branches: [rust-implementation, main, master, 'fork/**']
        paths:
            - 'rust/**'
            - 'letta-server/**'
            - 'letta-types/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'deny.toml'
            - '.github/workflows/rust-test.yml'
    pull_request:
        branches: [rust-implementation, main, master]
        paths:
            - 'rust/**'
            - 'letta-server/**'
            - 'letta-types/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'deny.toml'
    workflow_call:
        # Allow this workflow to be called by other workflows

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    test:
        name: Test Rust ${{ matrix.rust }}
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            matrix:
                # Edition 2024 requires nightly as of April 2026
                # Once edition 2024 stabilizes, update to minimum stable version
                rust: [stable, nightly]
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                   toolchain: ${{ matrix.rust }}
                   components: rustfmt, clippy

            - name: Install mold linker
              run: sudo apt-get update -qq && sudo apt-get install -y -qq mold

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: ~/.cargo/registry
                  key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-registry-

            - name: Cache cargo index
              uses: actions/cache@v5
              with:
                  path: ~/.cargo/git
                  key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-index-

            - name: Cache cargo build
              uses: actions/cache@v5
              with:
                  path: target
                  key: ${{ runner.os }}-cargo-build-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-build-${{ matrix.rust }}-

            - name: Check code formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy -p letta-server -p letta-types --all-targets --no-deps -- -D warnings

            - name: Build
              run: cargo build --verbose

            - name: Run all tests
              run: cargo test --tests --verbose

            - name: Test with all features
              # Note: We exclude letta's integration-tests feature since those require a running server
              # Note: schemars is now a direct dependency, not a feature
              run: cargo test --features http --tests --verbose

            - name: Generate test report
              if: matrix.rust == 'stable'
              run: |
                  echo "## 🦀 Rust Test Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Running comprehensive test suite..." >> $GITHUB_STEP_SUMMARY

                  # Run tests and capture output
                  cargo test --tests 2>&1 | tee test_output.txt

                  # Extract test counts
                  TOTAL_TESTS=$(grep "test result:" test_output.txt | awk '{sum+=$4+$6} END {print sum}')
                  PASSED_TESTS=$(grep "test result:" test_output.txt | awk '{sum+=$4} END {print sum}')
                  FAILED_TESTS=$(grep "test result:" test_output.txt | awk '{sum+=$6} END {print sum}')

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
                  echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Total Tests | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
                  echo "| Passed | $PASSED_TESTS ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Failed | $FAILED_TESTS |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Test Breakdown by Tool:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- Agent Advanced: 32 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- Memory Unified: 59 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- Tool Manager: 53 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- Source Manager: 50 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- MCP Ops: 42 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- Job Monitor: 34 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- File/Folder Ops: 16 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- Optimization Tests: 18 tests" >> $GITHUB_STEP_SUMMARY
                  echo "- Test Helpers: 8 tests" >> $GITHUB_STEP_SUMMARY

    coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: test
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-implementation')

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install mold linker
              run: sudo apt-get update -qq && sudo apt-get install -y -qq mold

            - name: Install cargo-tarpaulin
              run: cargo install cargo-tarpaulin

            - name: Generate coverage
              run: cargo tarpaulin --out Xml --output-dir ./coverage --verbose --packages letta-server letta-types --exclude-files "*/vendor/*" || true

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/cobertura.xml
                  flags: rust-tests
                  name: rust-codecov
                  fail_ci_if_error: false
                  verbose: true

            - name: Generate coverage report
              run: |
                  echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  # Parse coverage XML and extract percentage
                  if [ -f ./coverage/cobertura.xml ]; then
                    COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' ./coverage/cobertura.xml | head -1 | awk '{printf "%.1f", $1 * 100}')
                    echo "**Overall Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "Target: 85%" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "⚠️ Coverage report not generated" >> $GITHUB_STEP_SUMMARY
                  fi

    security:
        name: Security Audit
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Verify Cargo.lock is up to date
              run: |
                  cargo update --dry-run
                  if git diff --exit-code Cargo.lock; then
                      echo "✅ Cargo.lock is up to date"
                  else
                      echo "❌ Cargo.lock has uncommitted changes"
                      echo "Run 'cargo update' and commit Cargo.lock"
                      exit 1
                  fi

            - name: Run cargo audit (blocking)
              run: |
                  cargo install cargo-audit
                  cargo audit --deny warnings --ignore RUSTSEC-2026-0097

    benchmark:
        name: Performance Benchmarks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: test
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rust-implementation')

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install mold linker
              run: sudo apt-get update -qq && sudo apt-get install -y -qq mold

            - name: Run benchmarks
              run: |
                  echo "## ⚡ Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  # Run tests with timing
                  START_TIME=$(date +%s)
                  cargo test --tests --release
                  END_TIME=$(date +%s)
                  DURATION=$((END_TIME - START_TIME))

                  echo "**Test Suite Execution Time: ${DURATION}s**" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Target: < 2s" >> $GITHUB_STEP_SUMMARY

    all-checks-passed:
        name: All Checks Passed
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs: [test, security]
        if: always()

        steps:
            - name: Verify all checks passed
              run: |
                  if [[ "${{ needs.test.result }}" != "success" || 
                        "${{ needs.security.result }}" != "success" ]]; then
                    echo "❌ One or more checks failed"
                    exit 1
                  fi
                  echo "✅ All checks passed!"
                  echo "## ✅ All Checks Passed!" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "🦀 Rust tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "🔒 Security audit: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY

    supply-chain:
        name: Supply Chain Security
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install cargo-deny
              run: cargo install cargo-deny

            - name: Check dependencies
              run: cargo deny check
