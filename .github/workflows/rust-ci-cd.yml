name: Rust CI/CD Pipeline

on:
    push:
        branches: [rust-implementation, main, master, 'fork/**']
        paths:
            - 'rust/**'
            - 'letta-server/**'
            - 'letta-types/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.github/workflows/rust-ci-cd.yml'
            - '.github/workflows/rust-test.yml'
            - '.github/workflows/rust-docker-build.yml'
    pull_request:
        branches: [rust-implementation, main, master]
        paths:
            - 'rust/**'
            - 'letta-server/**'
            - 'letta-types/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.github/workflows/rust-ci-cd.yml'
            - '.github/workflows/rust-test.yml'
            - '.github/workflows/rust-docker-build.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Stage 1: Run all tests
    test:
        name: Run Tests
        uses: ./.github/workflows/rust-test.yml
        secrets: inherit

    # Stage 2: Build Docker image (only if tests pass)
    docker-build:
        name: Build Docker Image
        needs: test
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust-implementation' || startsWith(github.ref, 'refs/heads/fork/'))
        uses: ./.github/workflows/rust-docker-build.yml
        secrets: inherit

    # Stage 3: Deploy notification (future)
    notify:
        name: Notify Success
        needs: [test, docker-build]
        runs-on: ubuntu-latest
        if: success() && github.event_name == 'push'

        steps:
            - name: Summary
              run: |
                  echo "## 🎉 CI/CD Pipeline Complete!" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### ✅ Pipeline Stages:" >> $GITHUB_STEP_SUMMARY
                  echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "- Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### 📦 Docker Image:" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
                  echo "docker pull ghcr.io/oculairmedia/letta-mcp-server-rust:rust-latest" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
