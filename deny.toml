# cargo-deny configuration (v2)
# Run: cargo deny check

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0097: rand unsoundness with custom loggers using rand::rng()
    # Only triggers when a custom global logger panics during thread-local init.
    # We don't use custom loggers in this way. Transitive dep from turbomcp, tungstenite, etc.
    # TODO: Remove once rand releases a patched version
    "RUSTSEC-2026-0097",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
# Allow duplicate versions of these crates due to transitive dependencies
skip = [
    { name = "core-foundation" },
    { name = "getrandom" },
    { name = "hashbrown" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/oculairmedia/turbomcp.git",
]

[sources.allow-org]
github = ["oculairmedia"]
