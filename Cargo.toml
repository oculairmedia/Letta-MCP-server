[workspace]
members = [
    "letta-server",
    "letta-types",
]
resolver = "2"

# TurboMCP v3: Use our fork's v3-test branch (upstream v3.0.0-beta.5)
# No [patch.crates-io] needed — using direct git dependency.
# Internal sub-crates (turbomcp-core, turbomcp-types, etc.) are resolved
# via path deps within the git clone automatically.

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "io-util", "sync", "time", "fs"] }
futures = "0.3"

# TurboMCP v3 (fork: oculairmedia/turbomcp, branch: v3-test, base: upstream v3.0.0-beta.5)
turbomcp = { git = "https://github.com/oculairmedia/turbomcp.git", branch = "v3-test", features = ["http"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Letta SDK (vendored for compatibility fixes)
# NOTE: path is relative to repo root
letta = { path = "rust/vendor/letta" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["derive"] }
base64 = "0.22"
bytes = "1.9"

# TLS - vendored OpenSSL for cross-compilation support
openssl = { version = "0.10", features = ["vendored"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem utilities
tempfile = "3.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
incremental = true
