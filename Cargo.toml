[workspace]
members = [
    "letta-server",
    "letta-types",
]
resolver = "2"

# Patch turbomcp to use our fork (based on upstream v2.3.7) with $defs support and flatten-structs
[patch.crates-io]
turbomcp = { git = "https://github.com/oculairmedia/turbomcp.git", branch = "feature/flatten-structs" }
turbomcp-macros = { git = "https://github.com/oculairmedia/turbomcp.git", branch = "feature/flatten-structs" }
turbomcp-protocol = { git = "https://github.com/oculairmedia/turbomcp.git", branch = "feature/flatten-structs" }
turbomcp-server = { git = "https://github.com/oculairmedia/turbomcp.git", branch = "feature/flatten-structs" }
turbomcp-transport = { git = "https://github.com/oculairmedia/turbomcp.git", branch = "feature/flatten-structs" }

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "io-util", "sync", "time", "fs"] }
futures = "0.3"

# TurboMCP (fork: oculairmedia/turbomcp, branch: feature/flatten-structs, base: upstream v2.3.7)
turbomcp = { version = "2.3", features = ["http"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Letta SDK (vendored for compatibility fixes)
# NOTE: path is relative to repo root
letta = { path = "rust/vendor/letta" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.0", features = ["derive"] }
base64 = "0.22"
bytes = "1.9"

# TLS - vendored OpenSSL for cross-compilation support
openssl = { version = "0.10", features = ["vendored"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem utilities
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
incremental = true
