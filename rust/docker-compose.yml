services:
    letta-mcp-rust:
        image: ghcr.io/oculairmedia/letta-mcp-server-rust:fork-sdk-upgrade-wip
        container_name: letta-mcp-rust
        restart: unless-stopped
        ports:
            - '6507:6507'
        env_file:
            - ../.env
        environment:
            LETTA_BASE_URL: ${LETTA_BASE_URL:-http://localhost:8283}
            PORT: 6507
            TRANSPORT: http
            RUST_LOG: ${RUST_LOG:-info}
            RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
        healthcheck:
            test: ['CMD-SHELL', 'timeout 1 bash -c "</dev/tcp/localhost/6507" || exit 1']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        networks:
            - letta-network

networks:
    letta-network:
        name: letta-mcp-server_letta-network
        external: true
