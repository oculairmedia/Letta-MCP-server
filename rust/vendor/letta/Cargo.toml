[package]
edition = "2021"
name = "letta"
version = "0.1.3"
authors = ["Orual <orual@nonbinary.computer>"]
build = false
exclude = [
    ".claude",
    "CLAUDE*",
    ".direnv",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A robust Rust client for the Letta REST API"
documentation = "https://docs.rs/letta"
readme = "README.md"
keywords = [
    "letta",
    "ai",
    "agents",
    "api",
    "client",
]
categories = [
    "api-bindings",
    "web-programming::http-client",
]
license = "MIT"
repository = "https://github.com/orual/letta-rs"

[package.metadata]
