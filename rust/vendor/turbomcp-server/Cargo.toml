[package]
edition = "2024"
rust-version = "1.89.0"
name = "turbomcp-server"
version = "2.0.0-rc.3"
authors = ["Nicholas Paterno <nick@epistates.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast MCP server implementation with middleware, routing, and lifecycle management"
homepage = "https://turbomcp.org"
readme = "README.md"
keywords = [
    "mcp",
    "server",
    "middleware",
    "routing",
    "lifecycle",
]
categories = [
    "development-tools",
    "web-programming",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"

[features]
all-transports = [
    "stdio",
    "http",
    "websocket",
    "tcp",
    "unix",
]
auth = [
    "dep:jsonwebtoken",
    "dep:secrecy",
]
default = ["stdio"]
full = [
    "all-transports",
    "auth",
    "health-checks",
    "metrics",
    "middleware",
    "rate-limiting",
    "graceful-shutdown",
]
graceful-shutdown = []
health-checks = []
hot-reload = []
http = [
    "dep:turbomcp-transport",
    "turbomcp-transport/http",
    "middleware",
    "dep:axum",
    "dep:async-stream",
]
metrics = []
middleware = ["dep:tower-http"]
observability = []
rate-limiting = [
    "middleware",
    "dep:tower_governor",
]
stdio = [
    "dep:turbomcp-transport",
    "turbomcp-transport/stdio",
]
tcp = [
    "dep:turbomcp-transport",
    "turbomcp-transport/tcp",
]
unix = [
    "dep:turbomcp-transport",
    "turbomcp-transport/unix",
]
websocket = [
    "dep:turbomcp-transport",
    "turbomcp-transport/websocket",
    "http",
]

[lib]
name = "turbomcp_server"
path = "src/lib.rs"

[[bin]]
name = "turbomcp-server"
path = "src/main.rs"

[[test]]
name = "middleware_integration_tests"
path = "tests/middleware_integration_tests.rs"

[[test]]
name = "server_tests"
path = "tests/server_tests.rs"

[[test]]
name = "test_helpers"
path = "tests/test_helpers.rs"

[[test]]
name = "timeout_integration_tests"
path = "tests/timeout_integration_tests.rs"

[[bench]]
name = "middleware_benchmarks"
path = "benches/middleware_benchmarks.rs"
harness = false

[dependencies]
anyhow = "1.0"
dashmap = "6.1.0"
futures = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
regex = "1.10"

[dependencies.async-stream]
version = "0.3"
optional = true

[dependencies.async-trait]
version = "0.1"

[dependencies.axum]
version = "0.8.4"
features = [
    "ws",
    "json",
]
optional = true

[dependencies.bytes]
version = "1.5"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.config]
version = "0.14"

[dependencies.http]
version = "1.0"

[dependencies.jsonschema]
version = "0.17.1"
features = ["resolve-file"]
default-features = false

[dependencies.jsonwebtoken]
version = "9.2"
optional = true

[dependencies.secrecy]
version = "0.8"
features = ["serde"]
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
]

[dependencies.serde_json]
version = "1.0"
features = [
    "raw_value",
    "preserve_order",
]

[dependencies.thiserror]
version = "2.0.16"

[dependencies.tokio]
version = "1.47"
features = ["full"]

[dependencies.tokio-util]
version = "0.7"
features = ["full"]

[dependencies.tower]
version = "0.5.2"
features = ["full"]

[dependencies.tower-http]
version = "0.6.6"
features = ["full"]
optional = true

[dependencies.tower_governor]
version = "0.7"
optional = true

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
features = [
    "env-filter",
    "fmt",
    "json",
    "tracing-log",
]

[dependencies.turbomcp-macros]
version = "2.0.0-rc.3"
path = "../turbomcp-macros"

[dependencies.turbomcp-protocol]
version = "2.0.0-rc.3"
path = "../turbomcp-protocol"

[dependencies.turbomcp-transport]
version = "2.0.0-rc.3"
path = "../turbomcp-transport"
optional = true

[dependencies.uuid]
version = "1.6"
features = [
    "v4",
    "serde",
]

[dev-dependencies]
proptest = "1.5"

[dev-dependencies.criterion]
version = "0.5"
features = [
    "html_reports",
    "async_tokio",
]
