[package]
edition = "2024"
rust-version = "1.89.0"
name = "turbomcp-protocol"
version = "2.0.0-rc.3"
authors = ["Nicholas Paterno <nick@epistates.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Complete MCP protocol implementation with types, traits, context management, and message handling"
homepage = "https://turbomcp.org"
readme = "README.md"
keywords = [
    "mcp",
    "protocol",
    "jsonrpc",
    "llm",
    "ai",
]
categories = [
    "development-tools",
    "encoding",
    "parser-implementations",
]
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"

[features]
default = [
    "std",
    "simd",
]
fancy-errors = ["miette"]
lock-free = []
messagepack = ["msgpacker"]
metrics = ["dep:metrics"]
mmap = ["memmap2"]
