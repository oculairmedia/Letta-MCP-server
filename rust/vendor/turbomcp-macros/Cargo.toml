[package]
edition = "2024"
rust-version = "1.89.0"
name = "turbomcp-macros"
version = "2.0.0-rc.3"
authors = ["Nicholas Paterno <nick@epistates.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Procedural macros for ergonomic MCP tool and resource registration"
homepage = "https://turbomcp.org"
readme = "README.md"
keywords = [
    "mcp",
    "macros",
    "procedural",
    "derive",
    "codegen",
]
categories = ["development-tools"]
license = "MIT"
repository = "https://github.com/Epistates/turbomcp"

[features]
default = ["schema"]
http = ["axum"]
schema = ["schemars"]
tcp = [
    "tokio",
    "turbomcp-transport",
]
unix = [
    "tokio",
    "turbomcp-transport",
]

[lib]
name = "turbomcp_macros"
path = "src/lib.rs"
proc-macro = true

[[test]]
name = "error_integration_tests"
path = "tests/error_integration_tests.rs"

[[test]]
name = "helper_macro_tests"
path = "tests/helper_macro_tests.rs"

[dependencies]
proc-macro2 = "1.0"
