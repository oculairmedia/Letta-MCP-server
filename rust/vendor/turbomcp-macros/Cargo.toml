optional = true

[dependencies.turbomcp-protocol]
version = "2.0.0-rc.3"
path = "../turbomcp-protocol"

[dependencies.turbomcp-transport]
version = "2.0.0-rc.3"
path = "../turbomcp-transport"
optional = true

[dev-dependencies]
async-trait = "0.1"

[dev-dependencies.tokio]
version = "1.47"
features = ["full"]

[dev-dependencies.turbomcp-protocol]
version = "2.0.0-rc.3"
path = "../turbomcp-protocol"

