[package]
name = "letta-server"
version = "2.0.1"
edition = "2021"
authors = ["Oculair Media"]
description = "Letta MCP Server - Rust implementation using TurboMCP"
license = "MIT"

[[bin]]
name = "letta-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
# TurboMCP (patched via workspace [patch.crates-io] -> fork based on upstream v2.3.7)
turbomcp = { version = "2.3", features = ["http"] }
turbomcp-macros = "2.3"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
letta = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
openssl = { workspace = true, optional = true }

# TurboMCP internal crates (patched via workspace [patch.crates-io])
turbomcp-protocol = "2.3"
turbomcp-server = "2.3"
turbomcp-transport = { version = "2.3", features = ["http"] }

# Local dependencies
letta-types = { path = "../letta-types" }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
async-trait = "0.1"
wiremock = "0.6"
pretty_assertions = "1.4"

[features]
default = ["http"]
http = ["turbomcp/http", "turbomcp-transport/http"]
vendored-openssl = ["openssl"]
