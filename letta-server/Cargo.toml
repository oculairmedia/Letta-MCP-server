[package]
name = "letta-server"
version = "2.0.1"
edition = "2024"
authors = ["Oculair Media"]
description = "Letta MCP Server - Rust implementation using TurboMCP"
license = "MIT"

[[bin]]
name = "letta-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
# TurboMCP v3 (resolved via workspace git dep — re-exports everything via prelude)
turbomcp = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
letta = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
tempfile = { workspace = true }
openssl = { workspace = true, optional = true }

# NOTE: In v3, turbomcp re-exports all sub-crates via prelude.
# No need for separate turbomcp-macros, turbomcp-protocol, turbomcp-server, turbomcp-transport deps.

# Local dependencies
letta-types = { path = "../letta-types" }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
async-trait = "0.1"
wiremock = "0.6"
pretty_assertions = "1.4"

[features]
default = ["http"]
http = ["turbomcp/http"]
vendored-openssl = ["openssl"]
